# Serves the built React bundle and proxies the API.
#
# The proxy is the point of this file: the browser only ever talks to this
# origin, so `/api/calculate` is a same-origin request and CORS never applies.
# It also means the bundle never issues a request to a hard-coded host -- the
# app asks for a relative path and this file decides where that goes, so the
# backend can move without rebuilding the frontend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Anything under /api goes to the API container. proxy_pass carries no path
    # of its own, so nginx forwards the URI unchanged: a request for
    # /api/calculate arrives at the backend as /api/calculate, which is where
    # FastAPI's routes actually live.
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Vite fingerprints these filenames, so a given URL's contents can never
    # change and the response is safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must not be cached, or a browser would keep loading an
    # old page that references asset filenames the new deploy no longer has.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are routes, not missing files, so hand
    # them to index.html and let React decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
